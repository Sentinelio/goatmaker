<style>

.node{flex:1;max-width:220px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);cursor:pointer}.node:hover{border-color:#3a4068}.node.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.node b{display:block}.node small{color:var(--mut)}.node.off{opacity:.45}

.nb{padding:6px 10px;font-weight:700}.nb:disabled{opacity:.3}#bmenu{display:none}.crumb{font-size:12px;color:var(--mut);margin:0 0 6px}.crumb a{color:var(--mut);cursor:pointer}.crumb a:hover{color:var(--tx)}

<body>

<div id="login" class="login">
  <div class="card lg">
    <h2>Entrar</h2>
    <p class="mut small">Panel de Goatmaker. Se conecta sola al servidor de PocketBase.</p>
    <label class="small mut">Email</label>
    <input id="l-mail" type="email" autocomplete="username">
    <label class="small mut">Contraseña</label>
    <input id="l-pass" type="password" autocomplete="current-password">
    <button class="b gold" id="l-go" style="width:100%;padding:10px">Entrar</button>
    <p class="errt small" id="l-err"></p>
  </div>
</div>

<div id="app" class="app hide">
  <div class="top">
    <button class="b nb" id="bmenu" title="Menú">☰</button>
    <div class="brand"><b>Goat</b>maker <small>Admin</small></div>
    <span class="sp"></span>
    <a class="b linkbtn" href="../admin/" title="Pantallas que todavía están solo en el panel anterior">Panel anterior</a>
    <button class="b" id="refresh">Actualizar</button>
    <button class="b" id="logout">Salir</button>
  </div>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* Dirección del servidor: va dentro del panel. Solo se cambia aquí. */
var PB_URL="https://server-pc.tail3b4002.ts.net:8447";

/* Menú del prototipo. live = integrado en este panel; el resto aparece atenuado. */
var NAV=[
 ["Portal",[["resumen","◎","Resumen"],["analitica","▥","Analítica"],["avisos","✉","Avisos y mensajes"],["publicacion","⇪","Publicación"],["pruebas","⚗","Banco de pruebas"],["servidor","▤","Servidor y datos"]]],
 ["Usuarios",[["jugadores","☺","Usuarios"],["grupos","❖","Grupos"],["codigos","✦","Códigos y regalos"],["reportes","⚑","Bandeja de reportes"],["errores","⚠","Bandeja de errores"]]],
 ["Juego · Mundo",[["mundo","⚽","Mundo"]]],
 ["Juego · Contenido",[["situaciones","◷","Situaciones"],["talentos","❋","Talentos"],["entrenos","↗","Entrenamientos"],["entrenadores","☗","Entrenadores"],["tienda","🛍","Vida y tienda"],["patrocinios","★","Patrocinios"],["agentes","✆","Agentes y maniobras"]]],
 ["Juego · Pantallas",[["pantallas","▣","Pantallas"],["mapa","⇄","Mapa de pantallas"]]],
 ["Herramientas",[["tracker","✓","Tracker"]]],
 ["Juego · Reglas globales",[["eloreal","↕","Elo"],["personaje","♟","Personaje"],["piramide","△","Pirámide y edades"],["reloj","⏱","Reloj y probabilidades"],["economia","€","Economía"],["textos","❝","Textos generales"],["motor","⚙","Motor"]]],
 ["Otros",[["prioridades","≡","Prioridades"]]]
];
var LIVE={jugadores:1,codigos:1,reportes:1};

var $=function(id){return document.getElementById(id)};
var ST={tok:"",sec:"jugadores",players:[],codes:[],canjes:[],reports:[],sort:{k:"last_t",d:-1},rf:{estado:"nuevo",tipo:""}};
var IDX={pl:{}};

function index(){IDX.pl={};ST.players.forEach(function(p){IDX.pl[p.install]=p})}
function nom(p){return p.label||(p.estado&&p.estado.nombre)||p.install.slice(0,8)}
function hd(t,s){return '<div style="margin:6px 0 14px"><h1>'+t+'</h1><p class="sub">'+h(s)+'</p></div>'}

async function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:ST.tok},opt.headers||{});
  var r=await fetch(PB_URL+path,opt);
  if(r.status===401){logout();throw new Error("sesión caducada")}
  if(!r.ok){var t="";try{t=(await r.json()).message}catch(e){}throw new Error(r.status+" "+t)}
  return r.status===204?null:r.json();
}
async function all(col,q){var out=[],p=1,tp=1;do{var r=await api("/api/collections/"+col+"/records?perPage=500&page="+p+"&"+(q||""));out=out.concat(r.items);tp=r.totalPages;p++}while(p<=tp);return out}

async function login(){
  $("l-err").textContent="";
  try{
    var r=await fetch(PB_URL+"/api/collections/_superusers/auth-with-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identity:$("l-mail").value.trim(),password:$("l-pass").value})});
    var j=await r.json();if(!r.ok)throw new Error(j.message||r.status);
    ST.tok=j.token;try{sessionStorage.setItem("gm-adm",JSON.stringify({u:PB_URL,t:j.token}))}catch(e){}
    $("l-pass").value="";show();await load();
  }catch(e){$("l-err").textContent="No se pudo entrar: "+e.message}
}
function show(){$("login").classList.add("hide");$("app").classList.remove("hide")}

/* ---------- Funciones de acción (lógica del panel anterior) ---------- */
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function fdt(t){var d=new Date(t);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}
function by(a,f){var o={};a.forEach(function(x){var k=f(x);(o[k]=o[k]||[]).push(x)});return o}
function dev(ua){ua=ua||"";var m=/Mobi|Android|iPhone|iPad/.test(ua)?"Móvil":"Escritorio";var b=/Edg\//.test(ua)?"Edge":/Firefox\//.test(ua)?"Firefox":/Chrome\//.test(ua)?"Chrome":/Safari\//.test(ua)?"Safari":"Otro";return{tipo:m,nav:b}}
var CAT=[
  {k:"dinero",n:"Dinero",u:"€",def:50000,min:1,max:1000000000,fmt:function(v){return"+"+Number(v).toLocaleString("es-ES")+" €"}},
  {k:"xp",n:"Experiencia",u:"XP",def:500,min:1,max:1000000,fmt:function(v){return"+"+Number(v).toLocaleString("es-ES")+" XP"}},
  {k:"niveles",n:"Subir de nivel",u:"niveles",def:1,min:1,max:20,fmt:function(v){return"+"+v+" nivel(es)"}},
  {k:"atributos",n:"Atributos (todos)",u:"puntos",def:3,min:1,max:15,fmt:function(v){return"atributos +"+v}},
  {k:"ejes",n:"Los seis ejes de carácter",u:"puntos",def:5,min:1,max:20,fmt:function(v){return"ejes +"+v}},
  {k:"vestuario",n:"Cariño del vestuario",u:"puntos",def:10,min:1,max:30,fmt:function(v){return"vestuario +"+v}},
  {k:"fama",n:"Fama (+20, +5k seguidores, grada +15)",fmt:function(){return"fama +20"}},
  {k:"vital",n:"Forma 100 · Conf 90 · Míster 90 · Ánimo 90",fmt:function(){return"forma y ánimo al máximo"}},
  {k:"curar",n:"Curar lesión y sanción",fmt:function(){return"curar"}},
  {k:"taller",n:"Abrir el taller de pruebas (para ti)",fmt:function(){return"taller de pruebas"}}
];
function catDe(k){return CAT.find(function(c){return c.k===k})}
function fxTxt(ef){return(ef||[]).map(function(x){var c=catDe(x.k);return c?c.fmt(x.v):"⚠ "+h(x.k)}).join(" · ")||"—"}
function codBonito(c){return/^GM[A-Z0-9]{12}$/.test(c)?"GM-"+c.slice(2,6)+"-"+c.slice(6,10)+"-"+c.slice(10):c}
function codNuevo(){var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",s="GM",u=new Uint8Array(32),i;/* 31 símbolos sin 0 1 O I L; se descartan los bytes ≥ 248 para que no haya sesgo */while(s.length<14){crypto.getRandomValues(u);for(i=0;i<32&&s.length<14;i++)if(u[i]<248)s+=a[u[i]%31]}return s}
function estadoCod(c){var n=Date.now();if(!c.activo)return["Desactivado","bad"];if(c.hasta&&n>c.hasta)return["Caducado","bad"];if(c.desde&&n<c.desde)return["Aún no","blue"];if(c.max_usos&&c.usos>=c.max_usos)return["Agotado","bad"];return["Activo","ok"]}
function copiar(t){return(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t):Promise.reject()).catch(function(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()})}
function toast(t){var d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);color:var(--tx);padding:8px 14px;border-radius:10px;z-index:99";document.body.appendChild(d);setTimeout(function(){d.remove()},1400)}
function dtLocal(t){if(!t)return"";var d=new Date(t),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())}
async function crearCodigo(){
  var m=$("cf-msg"),ef=[];m.className="small mut";
  CAT.forEach(function(c){var cb=document.querySelector('[data-fk="'+c.k+'"]');if(cb&&cb.checked){var o={k:c.k};if(c.u){var v=Math.round(Number(document.querySelector('[data-fv="'+c.k+'"]').value));if(!(v>=c.min&&v<=c.max)){ef=null;m.className="small err";m.textContent="«"+c.n+"»: el valor tiene que estar entre "+c.min+" y "+c.max+".";return}o.v=v}if(ef)ef.push(o)}});
  if(ef===null)return;if(!ef.length){m.className="small err";m.textContent="Marca al menos un efecto.";return}
  var cad=$("cf-cad").value,hasta=0;if(cad==="x"){hasta=$("cf-fecha").value?new Date($("cf-fecha").value).getTime():0;if(!hasta){m.className="small err";m.textContent="Elige la fecha de caducidad.";return}}else if(+cad)hasta=Date.now()+(+cad)*86400000;
  var code=($("cf-code").value||"").toUpperCase().replace(/[^A-Z0-9]/g,""),manual=!!code;if(manual&&(code.length<4||code.length>24)){m.className="small err";m.textContent="El código a mano tiene que tener entre 4 y 24 letras o cifras.";return}
  var body={nota:$("cf-nota").value.trim().slice(0,200),efectos:ef,max_usos:Math.max(0,Math.round(+$("cf-max").value||0)),usos:0,una_por_jugador:$("cf-uno").checked,desde:0,hasta:hasta,activo:true};
  for(var i=0;i<4;i++){body.code=manual?code:codNuevo();
    try{await api("/api/collections/tl_codes/records",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      await copiar(codBonito(body.code));ST.codes=await all("tl_codes","sort=-created");render();toast("Creado y copiado: "+codBonito(body.code));return}
    catch(e){if(manual||i===3){m.className="small err";m.textContent="No se pudo crear: "+e.message+(manual?" (¿ya existe ese código?)":"");return}}}
}
async function accionCodigo(a,id){
  var c=ST.codes.find(function(x){return x.id===id});if(!c)return;
  try{
    if(a==="copiar"){await copiar(codBonito(c.code));return toast("Copiado: "+codBonito(c.code))}
    if(a==="toggle"){await api("/api/collections/tl_codes/records/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({activo:!c.activo})})}
    if(a==="borrar"){if(!confirm("¿Borrar el código "+codBonito(c.code)+"? Se conserva el historial de canjes."))return;await api("/api/collections/tl_codes/records/"+id,{method:"DELETE"})}
    if(a==="regen"){var d=prompt("Regenerar "+codBonito(c.code)+" con la cadena nueva, usos a 0 y reactivado.\n\n¿Días de validez desde ahora? (0 = sin caducidad · vacío = dejar el límite como está)","");if(d===null)return;
      var patch={usos:0,activo:true};if(String(d).trim()!==""){var n=Math.max(0,Math.round(+d||0));patch.hasta=n?Date.now()+n*86400000:0}else if(c.hasta&&Date.now()>c.hasta){alert("El código estaba caducado: indica cuántos días de validez nuevos (0 = sin caducidad).");return}
      var ok2=false;for(var i=0;i<4&&!ok2;i++){patch.code=codNuevo();try{await api("/api/collections/tl_codes/records/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});ok2=true}catch(e){if(i===3)throw e}}
      await copiar(codBonito(patch.code));toast("Nuevo código copiado: "+codBonito(patch.code))}
    ST.codes=await all("tl_codes","sort=-created");render()
  }catch(e){alert("No se pudo: "+e.message)}
}

var RTIPO={bug:["🐞","Fallo"],idea:["💡","Idea"],otro:["💬","Otro"]},RESTADOS=[["nuevo","Nuevo"],["visto","Visto"],["hecho","Hecho"],["descartado","Descartado"]];

function repTexto(r){
  var p=IDX.pl[r.install],e=(r.ctx&&r.ctx.estado)||(p&&p.estado)||{},d=dev((r.ctx&&r.ctx.ua)||(p&&p.ua)||"");
  return"[Goatmaker · "+(RTIPO[r.tipo]||RTIPO.otro)[1].toLowerCase()+" · versión "+((r.ctx&&r.ctx.ver)||"?")+"]\nJugador: "+(p?nom(p):r.install.slice(0,8))+(e.club_n?" · "+e.club_n+" ("+(e.division==="2"?"Segunda":"Primera")+", T"+e.temporada+" J"+e.jornada+", nivel "+e.nivel+")":"")+" · "+d.tipo+" "+d.nav+((r.ctx&&r.ctx.vp)?" "+r.ctx.vp:"")
    +"\nFecha: "+fdt(r.t)+"\n\n"+r.texto+((r.ctx&&r.ctx.adjunta)?"\n\n(tiene la partida adjunta en el panel)":"")+(r.nota_admin?"\n\nNota mía: "+r.nota_admin:"")}
async function accionReporte(a,id){
  var r=ST.reports.find(function(x){return x.id===id});if(!r)return;
  try{
    if(a==="copiar"){await copiar(repTexto(r));if(r.estado==="nuevo"){await api("/api/collections/tl_reports/records/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({estado:"visto"})});r.estado="visto";render()}return toast("Copiado: pégaselo a Claude")}
    if(a==="partida"){var x=await api("/api/collections/tl_reports/records/"+id),s=x.save;if(!s||!Object.keys(s).length)return alert("Este reporte no trae partida.");var b=new Blob([JSON.stringify(s)],{type:"application/json"}),el=document.createElement("a");el.href=URL.createObjectURL(b);el.download="goatmaker-reporte-"+id+"-t"+s.temporada+"-j"+(s.jornada+1)+".json";el.click();return}
    if(a==="borrar"){if(!confirm("¿Borrar este reporte?"))return;await api("/api/collections/tl_reports/records/"+id,{method:"DELETE"});ST.reports=ST.reports.filter(function(x){return x.id!==id});render()}
  }catch(e){alert("No se pudo: "+e.message)}
}
